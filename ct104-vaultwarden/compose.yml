# CT104 vaultwarden on node-c. Live path: /mnt/vault_data/docker-compose.yml
# Keep the folder name /mnt/vault_data. Docker uses it as the project name.
# The same folder holds the vault database and keys. Only this file goes to Git.
# Image pinned by digest (Vaultwarden 1.37.3).
services:
  vaultwarden:
    image: vaultwarden/server@sha256:1587c45feaa479f1f5e8af3b00eded36bff77bcf1880cf8dbf0541706dd470e0
    container_name: vaultwarden
    restart: always
    environment:
      - TZ=America/Chicago
      - WEBSOCKET_ENABLED=true
    volumes:
      - /mnt/vault_data:/data
    ports:
      - 8084:80
