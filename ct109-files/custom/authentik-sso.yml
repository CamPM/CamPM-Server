---
services:
  opencloud:
    environment:
      OC_OIDC_ISSUER: https://auth.example.com/application/o/opencloud/
      OC_EXCLUDE_RUN_SERVICES: idp
      PROXY_OIDC_ACCESS_TOKEN_VERIFY_METHOD: jwt
      PROXY_OIDC_REWRITE_WELLKNOWN: "true"
      OC_OIDC_CLIENT_ID: web
      OC_OIDC_CLIENT_SCOPES: openid profile email
      WEBFINGER_WEB_OIDC_CLIENT_ID: web
      WEBFINGER_WEB_OIDC_CLIENT_SCOPES: openid profile email
      WEBFINGER_DESKTOP_OIDC_CLIENT_ID: web
      WEBFINGER_DESKTOP_OIDC_CLIENT_SCOPES: openid profile email offline_access
      WEBFINGER_ANDROID_OIDC_CLIENT_ID: web
      WEBFINGER_ANDROID_OIDC_CLIENT_SCOPES: openid profile email offline_access
      WEBFINGER_IOS_OIDC_CLIENT_ID: web
      WEBFINGER_IOS_OIDC_CLIENT_SCOPES: openid profile email offline_access
      PROXY_USER_OIDC_CLAIM: email
      PROXY_USER_CS3_CLAIM: mail
      PROXY_AUTOPROVISION_ACCOUNTS: "false"
      PROXY_ROLE_ASSIGNMENT_DRIVER: oidc
      PROXY_ROLE_ASSIGNMENT_OIDC_CLAIM: groups
      GRAPH_ASSIGN_DEFAULT_USER_ROLE: "false"
      IDP_DOMAIN: auth.example.com
      WEB_OPTION_ACCOUNT_EDIT_LINK_HREF: https://auth.example.com/if/user/
    volumes:
      - ./config/opencloud/proxy-sso.yaml:/etc/opencloud/proxy.yaml
