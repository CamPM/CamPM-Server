
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

homeassistant:
  auth_providers:
    - type: homeassistant
    - type: trusted_networks
      trusted_networks:
        - 192.0.2.32/32
        - 203.0.113.10/32
      trusted_users:
        203.0.113.10: REPLACE_WITH_USER_ID
        192.0.2.32: REPLACE_WITH_USER_ID
      allow_bypass_login: true

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 127.0.0.1
    - 172.22.0.11
    - 172.22.0.0/16
    - 192.0.2.50
    - 192.0.2.3

camera:
  - platform: ffmpeg_motion
    name: Proxmox USB Camera
    input: -f v4l2 -i /dev/video0
    