dir: local
	path /var/lib/vz
	content iso,vztmpl,backup,import

zfspool: ha-zfs
	pool ha-pool
	content images,rootdir
	mountpoint /ha-pool
	nodes node-b,node-a,node-c

zfspool: tank-zfs
	pool tank
	content rootdir,images
	mountpoint /mnt/disk2
	nodes node-a

zfspool: backup-zfs
	pool backup
	content images,rootdir
	nodes node-b

dir: backup-vzdump
	path /backup/vzdump
	content backup
	nodes node-b
	prune-backups keep-daily=7,keep-weekly=4,keep-monthly=2

nfs: backup-nfs
	export /backup/vzdump
	path /mnt/pve/backup-nfs
	server 192.0.2.50
	content backup
	options vers=4.2
	prune-backups keep-daily=7,keep-weekly=2

nfs: mediaNFS
	export /mnt/disk2/external_sub/Media
	path /mnt/pve/mediaNFS
	server 192.0.2.3
	content images
	nodes node-b,node-c
	prune-backups keep-all=1

